title: Internal Host Submits Tasks to an Agentic Offensive Framework API
id: f8021648-6d72-4533-8052-56fcc36445e3
status: experimental
description: >
  Detects an internal host logging in to, or posting tasks to, the ARTEX task API. The niudaii fork of
  ScopeSentry (an asset-mapping platform) logs in at /api/auth/login and posts each selected asset as a
  task goal to /api/tasks on the ARTEX API, whose default port is 8787. A recon platform feeding an agentic
  exploitation framework is either an unsanctioned red-team setup or an operator's staging host.
references:
  - https://github.com/niudaii/ScopeSentry
  - https://www.spectrum.security/blog/offensive-ai-tools-in-the-wild
  - https://github.com/Ridd1kulusC0d3r/LLmInjection
author: LLMInjection
date: 2026-11-20
tags:
  - attack.reconnaissance
  - attack.t1595
  - llminjection.det-ai-058
  - llminjection.llmi-t015
logsource:
  category: proxy
detection:
  selection_port:
    dst_port: 8787
  selection_path:
    cs-method: 'POST'
    c-uri|endswith:
      - '/api/auth/login'
      - '/api/tasks'
  condition: selection_port and selection_path
falsepositives:
  - Sanctioned red-team or pentest platforms running ARTEX; allowlist the operator hosts and record the engagement.
  - Unrelated services on port 8787 with the same routes; confirm with the response realm or page title.
level: high
