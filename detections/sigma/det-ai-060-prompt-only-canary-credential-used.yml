title: Canary Credential That Only Ever Lived in LLM Prompts Is Used
id: d4dbe9b4-2100-4be7-8ff5-741d7fa3f662
status: experimental
description: >
  Detects any AWS API call made with an access key that exists only as a canary planted in prompts sent
  through an AI gateway or third-party inference provider. A hit means prompt content was logged, retained or
  read by someone outside your control (provider, reseller or attacker). Dragos seeded canary credentials in
  about 2 million prompts and saw planted AWS keys used by third parties; OpenRouter then removed three
  providers from Zero Data Retention. Also relevant when an agent tool returns secrets into model context
  (CVE-2026-135614). Replace the placeholder key IDs with your own canaries; the keys must have no permissions.
references:
  - https://openrouter.ai/blog/announcements/data-processing-incidents-on-inference-providers/
  - https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
  - https://aws.amazon.com/security/security-bulletins/2026-200-aws/
  - https://github.com/Ridd1kulusC0d3r/LLmInjection
author: LLMInjection
date: 2026-11-25
tags:
  - attack.credential-access
  - attack.t1552
  - attack.initial-access
  - attack.t1078.004
  - llminjection.det-ai-060
  - llminjection.llmi-t004
  - llminjection.llmi-t016
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_canary_key:
    userIdentity.accessKeyId:
      - 'AKIAEXAMPLECANARY001'   # placeholder: canary planted in prompts to provider A
      - 'AKIAEXAMPLECANARY002'   # placeholder: canary planted in prompts to provider B
  condition: selection_canary_key
falsepositives:
  - None expected if the canary keys are used nowhere else; a hit from your own test harness should be tagged and excluded by source IP.
  - Key IDs must be unique per provider or route, otherwise the alert cannot tell which one leaked.
level: critical
