<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--paper:#f3f0e8;--paper-2:#ebe7dc;--ink:#17150f;--ink-2:#4a463c;--ink-3:#68635a;--rule:#cfc9ba;--signal:#b43c0e;
--serif:"Liberation Serif",Georgia,serif;--mono:"DejaVu Sans Mono",monospace;--sans:Inter,system-ui,sans-serif}
html,body{margin:0;width:1440px;height:810px;overflow:hidden;background:var(--paper);color:var(--ink)}
.scene{position:absolute;inset:0;display:none;padding:0 120px;box-sizing:border-box}
.scene.on{display:block}
.kicker{font:600 15px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.rule{height:2px;background:var(--ink);transform-origin:left}
h1{font:700 96px/1.02 var(--serif);letter-spacing:-.025em;margin:0}
.q{font:700 74px/1.08 var(--serif);letter-spacing:-.02em;margin:0;position:absolute;left:120px;right:120px}
.q em{font-style:italic;color:var(--signal)}
.mark{font:700 128px/1 var(--serif);letter-spacing:-.035em}
.mark b{color:var(--signal);font-weight:700}
.sub{font:italic 30px/1.4 var(--serif);color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.cell{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:22px 26px 20px}
.cell:nth-child(3n){border-right:0}
.num{font:700 84px/1 var(--mono);letter-spacing:-.03em}
.lab{font:600 15px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.links{font:500 26px/1.7 var(--mono)}
.links span{color:var(--ink-3)}
.pill{display:inline-block;border:2px solid var(--ink);padding:10px 22px;font:700 18px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.pill.s{background:var(--signal);border-color:var(--signal);color:#fff}
.corner{position:absolute;left:120px;right:120px;top:44px;display:flex;justify-content:space-between;font:600 13px var(--mono);letter-spacing:.2em;color:var(--ink-2);text-transform:uppercase}
</style></head>
<body>
<div class="scene" id="intro">
  <div class="corner"><span>LLMInjection / AI &amp; LLM threat intelligence</span><span id="introDate"></span></div>
  <div class="q" id="q1" style="top:300px"></div>
  <div class="q" id="q2" style="top:300px"></div>
  <div class="q" id="q3" style="top:300px"></div>
  <div id="wm" style="position:absolute;left:120px;right:120px;top:250px">
    <div class="kicker" id="wmKick"></div>
    <div class="rule" id="wmRule" style="margin:22px 0 26px"></div>
    <div class="mark">LLM<b>Injection</b></div>
    <div class="sub" id="wmSub" style="margin-top:22px"></div>
  </div>
</div>

<div class="scene" id="stats">
  <div class="corner"><span>LLMInjection</span><span id="statsAsof"></span></div>
  <div style="position:absolute;left:120px;right:120px;top:130px">
    <div class="kicker" id="statsKick"></div>
    <h1 id="statsTitle" style="margin:18px 0 40px;font-size:64px"></h1>
    <div class="grid" id="statsGrid"></div>
  </div>
</div>

<div class="scene" id="chapter">
  <div class="corner"><span>LLMInjection</span><span id="chapNo"></span></div>
  <div style="position:absolute;left:120px;right:120px;top:270px">
    <div class="kicker" id="chapKick"></div>
    <div class="rule" id="chapRule" style="margin:22px 0 30px"></div>
    <h1 id="chapTitle"></h1>
    <div class="sub" id="chapSub" style="margin-top:24px;max-width:1000px"></div>
  </div>
</div>

<div class="scene" id="outro">
  <div class="corner"><span>LLMInjection</span><span>Apache-2.0</span></div>
  <div style="position:absolute;left:120px;right:120px;top:150px">
    <div class="kicker" id="outKick"></div>
    <div class="rule" id="outRule" style="margin:22px 0 30px"></div>
    <h1 id="outTitle" style="font-size:88px"></h1>
    <div class="links" id="outLinks" style="margin-top:44px"></div>
    <div id="outCta" style="margin-top:40px;display:flex;gap:16px"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
// fade+rise between t0..t1 in, t2..t3 out
function vis(el,t,t0,t1,t2=1e9,t3=1e9,rise=24){
  const a=out((t-t0)/(t1-t0))*(1-ease((t-t2)/(t3-t2)));
  el.style.opacity=a;el.style.transform=`translateY(${(1-out((t-t0)/(t1-t0)))*rise - ease((t-t2)/(t3-t2))*rise}px)`;
}
let C={};
window.setup=c=>{C=c;
  $("#introDate").textContent=c.asof;$("#statsAsof").textContent=c.asof;
  ["q1","q2","q3"].forEach((id,i)=>$("#"+id).innerHTML=c.questions[i]);
  $("#wmKick").textContent=c.wmKick;$("#wmSub").textContent=c.wmSub;
  $("#statsKick").textContent=c.statsKick;$("#statsTitle").textContent=c.statsTitle;
  $("#statsGrid").innerHTML=c.stats.map(s=>`<div class="cell"><div class="num" data-v="${s[0]}">0</div><div class="lab">${s[1]}</div></div>`).join("");
  $("#outKick").textContent=c.outKick;$("#outTitle").innerHTML=c.outTitle;
  $("#outLinks").innerHTML=c.outLinks.map(l=>`<div><span>→</span> ${l}</div>`).join("");
  $("#outCta").innerHTML=c.outCta.map((x,i)=>`<span class="pill${i==0?" s":""}">${x}</span>`).join("");
};
window.scene=(name,t,opt={})=>{
  document.querySelectorAll(".scene").forEach(s=>s.classList.toggle("on",s.id===name));
  if(name==="intro"){
    vis($("#q1"),t,.15,.7,1.55,1.9);vis($("#q2"),t,1.95,2.45,3.3,3.65);vis($("#q3"),t,3.7,4.2,5.05,5.4);
    vis($("#wm"),t,5.5,6.2);
    $("#wmRule").style.transform=`scaleX(${ease((t-5.6)/0.9)})`;
  }
  if(name==="stats"){
    vis($("#statsKick"),t,0,.5);vis($("#statsTitle"),t,.1,.6);
    document.querySelectorAll("#statsGrid .cell").forEach((c,i)=>{
      vis(c,t,.35+i*.12,.85+i*.12,1e9,1e9,18);
      const n=c.querySelector(".num"),v=+n.dataset.v;n.textContent=Math.round(v*ease((t-.4-i*.12)/1.4));
    });
  }
  if(name==="chapter"){
    $("#chapNo").textContent=opt.no;$("#chapKick").textContent=opt.kick;$("#chapTitle").innerHTML=opt.title;$("#chapSub").textContent=opt.sub;
    vis($("#chapKick"),t,0,.45);$("#chapRule").style.transform=`scaleX(${ease((t-.1)/.8)})`;
    vis($("#chapTitle"),t,.2,.75);vis($("#chapSub"),t,.5,1.05);
  }
  if(name==="outro"){
    vis($("#outKick"),t,0,.45);$("#outRule").style.transform=`scaleX(${ease((t-.1)/.8)})`;
    vis($("#outTitle"),t,.2,.8);
    document.querySelectorAll("#outLinks div").forEach((d,i)=>vis(d,t,.8+i*.25,1.3+i*.25));
    vis($("#outCta"),t,1.5,2.0);
  }
};
</script>
</body></html>
