<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | LLMInjection</title>
<style>
:root{--paper:#f6f5f1;--card:#ffffff;--ink:#15140f;--ink-2:#45423a;--rule:#d6d2c6;--signal:#b43c0e;--signal-soft:#f7e6dc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#100f0d;--card:#1c1b17;--ink:#eeebe2;--ink-2:#bdb8aa;--rule:#36332b;--signal:#f0885a;--signal-soft:#3a2418;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{width:min(560px,100% - 40px);background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:28px 30px;box-shadow:0 14px 40px -18px rgba(0,0,0,.25)}
.k{display:inline-block;font:700 10.5px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);background:var(--signal-soft);border-radius:999px;padding:5px 10px}
h1{font:800 clamp(30px,8vw,44px)/1.05 "Inter",system-ui,sans-serif;letter-spacing:-.03em;margin:14px 0 12px}
p{color:var(--ink-2);margin:0 0 22px}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--signal);text-underline-offset:3px}
a:hover{color:var(--signal)}
</style>
</head>
<body>
<main>
  <div class="k">404 / record not found</div>
  <h1>That page is not in the dataset.</h1>
  <p>The link may be old, or the record was renamed. The Explorer lists every actor, campaign, technique and detection, each with its evidence.</p>
  <p><a id="home" href="./">Open the Explorer</a> &nbsp;·&nbsp; <a href="https://github.com/Ridd1kulusC0d3r/LLmInjection">Repository</a></p>
</main>
<script>
// project pages live under /<repo>/, so the first path segment is the site root
var seg = location.pathname.split("/")[1];
if (seg && location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + seg + "/";
</script>
</body>
</html>
