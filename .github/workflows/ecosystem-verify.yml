name: Verify ecosystem map

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-verify every repository with git (reachability, last commit, licence)
        run: python scripts/verify_ecosystem.py --write
      - name: Add GitHub archive flag and renames from the API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_ecosystem.py --write --report ecosystem-report.md
          cat ecosystem-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Collect adoption and supply-chain signals (deps.dev, OSV; keyless)
        run: |
          python scripts/osint_ecosystem.py --report docs/ECOSYSTEM-SIGNALS.md
          cat docs/ECOSYSTEM-SIGNALS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and refreshed dataset
        uses: actions/upload-artifact@v6
        with:
          name: ecosystem-verification
          path: |
            ecosystem-report.md
            data/ecosystem.json
            data/ecosystem-osint.json
            docs/ECOSYSTEM-SIGNALS.md
