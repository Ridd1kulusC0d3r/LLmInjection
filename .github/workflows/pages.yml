name: Deploy AI Threat Intelligence Explorer

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "data/**"
      - "assets/**"
      - "scripts/build_graph.py"
      - "scripts/build_api.py"
      - "scripts/build_navigator.py"
      - "scripts/coverage_model.py"
      - "detections/**"
      - "scripts/build_snapshot.py"
      - "scripts/diff_intelligence.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate intelligence
        run: python scripts/validate_intel.py
      - name: Build graph exports
        run: python scripts/build_graph.py

      - name: Build current intelligence diff
        shell: bash
        run: |
          BASELINE="$(find data/snapshots -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          python scripts/build_snapshot.py --output dist/current-snapshot.json
          python scripts/diff_intelligence.py             --baseline "$BASELINE"             --current dist/current-snapshot.json             --output dist/intelligence-diff.json             --markdown dist/intelligence-diff.md

      - name: Build static API
        run: python scripts/build_api.py

      - name: Build coverage model
        run: python scripts/coverage_model.py

      - name: Build Navigator layers
        run: python scripts/build_navigator.py

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp dist/graph.json _site/graph.json
          cp dist/graph.graphml _site/graph.graphml
          cp dist/llminjection-stix.json _site/llminjection-stix.json
          cp data/threat-landscape-2026.json _site/landscape.json
          cp data/ecosystem.json _site/ecosystem.json
          cp dist/coverage.json _site/coverage.json
          cp dist/current-snapshot.json _site/current-snapshot.json
          cp dist/intelligence-diff.json _site/intelligence-diff.json
          cp dist/intelligence-diff.md _site/intelligence-diff.md
          cp -R dist/api _site/api
          cp -R dist/navigator _site/navigator
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
