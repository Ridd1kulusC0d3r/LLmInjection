name: Deploy AI Threat Intelligence Explorer

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "data/**"
      - "assets/**"
      - "scripts/build_graph.py"
      - "scripts/build_api.py"
      - "scripts/build_navigator.py"
      - "scripts/coverage_model.py"
      - "detections/**"
      - "scripts/build_snapshot.py"
      - "scripts/build_site.py"
      - "scripts/diff_intelligence.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate intelligence
        run: python scripts/validate_intel.py
      - name: Build the Explorer (graph, diff, API, Navigator layers, coverage model) into _site
        run: python scripts/build_site.py --out _site

      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
