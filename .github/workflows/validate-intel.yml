name: Validate intelligence data

on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/validate_intel.py"
      - ".github/workflows/validate-intel.yml"
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/validate_intel.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structured intelligence
        run: python scripts/validate_intel.py
