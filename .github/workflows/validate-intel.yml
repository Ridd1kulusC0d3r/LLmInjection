name: Validate intelligence data

on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "detections/**"
      - "tests/**"
      - "reports/**"
      - "integrations/**"
      - "docs/**"
      - "assets/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/validate-intel.yml"
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "detections/**"
      - "tests/**"
      - "reports/**"
      - "integrations/**"
      - "docs/**"
      - "assets/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/validate-intel.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install --quiet ruff==0.15.20
          ruff check scripts tests integrations

      - name: Compile Python
        run: python -m compileall -q scripts integrations

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test local intelligence queries
        run: |
          python scripts/query_intel.py search "prompt injection" --limit 3 > /dev/null
          python scripts/query_intel.py coverage LLMI-T015 > /dev/null
          python scripts/query_intel.py neighbors ACTOR-GTG-1002 --limit 5 > /dev/null

      - name: Validate structured intelligence
        run: python scripts/validate_intel.py

      - name: Audit graph for orphaned records
        run: python scripts/audit_graph.py --strict

      - name: Exercise living-intelligence intake with fixtures
        run: |
          python scripts/intel_intake.py             --fixture tests/fixtures/intake-responses.json             --dry-run             --report /tmp/intake.md             --summary-json /tmp/intake-summary.json

      - name: Build intelligence snapshot and diff
        run: |
          python scripts/build_snapshot.py --output /tmp/current-snapshot.json
          python scripts/diff_intelligence.py             --baseline data/snapshots/2026-09.json             --current /tmp/current-snapshot.json             --output /tmp/intelligence-diff.json             --markdown /tmp/intelligence-diff.md
          python scripts/generate_landscape_report.py             --snapshot /tmp/current-snapshot.json             --diff /tmp/intelligence-diff.json             --period 2026-10             --output /tmp/monthly-landscape.md

      - name: Build graph exports
        run: python scripts/build_graph.py

      - name: Build static API
        run: python scripts/build_api.py

      - name: Build release package
        run: python scripts/build_release.py

      - name: Exercise safe lab plan
        run: python scripts/run_safe_lab.py --profile all --adapter plan > /dev/null

      - name: Upload generated intelligence exports
        uses: actions/upload-artifact@v6
        with:
          name: llminjection-intelligence-exports
          path: dist/
