name: Correct a record
description: Report a wrong attribution, confidence level, date, mapping or broken source link.
labels: [correction]
body:
  - type: input
    id: record
    attributes:
      label: Record ID
      placeholder: ACTOR-APT28, CAMPAIGN-..., SRC-...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and what does the evidence say?
      description: Link the primary source. Corrections that lower confidence are as welcome as ones that raise it.
    validations:
      required: true
